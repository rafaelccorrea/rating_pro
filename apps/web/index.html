    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Rating Pro",
        "description": "Plataforma de rating de crédito white label para correspondentes bancários, assessores de crédito e contadores.",
        "areaServed": "BR",
        "knowsLanguage": "pt-BR"
      }
    </script>

    <script>
      // Aplica o tema antes da primeira pintura para nao piscar ao trocar.
      // O padrao e CLARO: o dark mode so entra se a pessoa escolher no toggle.
      // De proposito nao seguimos prefers-color-scheme, para o visitante que
      // usa o sistema no escuro ainda receber a marca no tema claro.
      (function () {
        try {
          // Chave versionada: a versao anterior gravava aqui o tema resolvido do
          // SISTEMA, entao quem usa o SO no escuro ficou com 'dark' salvo sem
          // nunca ter escolhido. Trocar a chave descarta essas preferencias
          // herdadas e faz todos voltarem ao padrao claro.
          localStorage.removeItem('rating-pro:theme');
          var stored = localStorage.getItem('rating-pro:theme.v2');
          var resolved = stored === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.style.colorScheme = resolved;
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
